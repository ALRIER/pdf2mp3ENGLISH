name: Download and smoke-test Kokoro on CPU
on:
  workflow_dispatch:
jobs:
  kokoro-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install eSpeak NG and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng libsndfile1
      - name: Install model and application dependencies
        run: pip install -r requirements.txt
      - name: Download weights from Hugging Face and synthesize a sample
        run: python scripts/download_model.py
