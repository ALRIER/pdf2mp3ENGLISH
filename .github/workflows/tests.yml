name: CPU pipeline validation
on:
  push:
    branches: [main, modern-tts-v1]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight validation dependencies
        run: pip install pytest "pymupdf>=1.25,<2" "python-docx>=1.1,<2" "numpy>=1.26,<3" "soundfile>=0.13,<1"
      - name: Compile application sources
        run: python -m compileall -q app.py pipeline.py synthesis.py scripts
      - name: Run CPU document pipeline tests
        run: python -m pytest -q
