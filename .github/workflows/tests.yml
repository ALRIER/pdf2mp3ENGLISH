name: CPU pipeline tests
on:
  push:
    branches: [main, modern-tts-v1]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest "pymupdf>=1.25,<2" "python-docx>=1.1,<2"
      - run: pytest -q
